<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barber Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            max-width: 400px;
            margin: auto;
            background: #1c1c1c;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        #current-status {
            font-size: 28px;
            margin: 25px 0;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 18px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .open {
            background: #22c55e;
            color: white;
        }

        .closed {
            background: #ef4444;
            color: white;
        }

        #message {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Barber Admin</h1>

    <div>
        Current status:
    </div>

    <div id="current-status">
        Loading...
    </div>

    <button class="open" onclick="changeStatus('OPEN')">
        🟢 OPEN
    </button>

    <button class="closed" onclick="changeStatus('CLOSED')">
        🔴 CLOSED
    </button>

    <div id="message"></div>

</div>

<script>

const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// قراءة الحالة الحالية
async function loadStatus() {

    const { data, error } = await supabaseClient
        .from("settings")
        .select("status")
        .eq("id", 1)
        .single();

    if (error) {
        console.error(error);
        document.getElementById("current-status").textContent = "ERROR";
        return;
    }

    document.getElementById("current-status").textContent = data.status;
}


// تغيير الحالة
async function changeStatus(newStatus) {

    document.getElementById("message").textContent = "Updating...";

    const { error } = await supabaseClient
        .from("settings")
        .update({
            status: newStatus
        })
        .eq("id", 1);

    if (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "❌ Error: " + error.message;

        return;
    }

    document.getElementById("current-status").textContent = newStatus;

    document.getElementById("message").textContent =
        "✅ Status updated successfully!";
}


loadStatus();

</script>

</body>
</html>
